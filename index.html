<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,Roboto}
body{background:#f1f3f6;padding-bottom:70px}
.header{background:#131921;color:#fff;padding:12px;display:flex;gap:10px;align-items:center;position:sticky;top:0;z-index:99}
.logo{font-weight:900;font-size:22px}.logo span{color:#febd69}
.search{flex:1;background:#fff;border-radius:8px;display:flex;height:42px;overflow:hidden}
.search input{flex:1;border:0;padding:0 12px;outline:0}
.cart{position:relative;font-size:24px} .count{position:absolute;top:-6px;right:-8px;background:#ff6f00;color:#fff;font-size:11px;padding:2px 6px;border-radius:12px}
.banner{margin:10px;border-radius:14px;background:linear-gradient(135deg,#ff9900,#ff3c00);color:#fff;padding:20px;text-align:center}
.chips{display:flex;gap:8px;padding:10px;overflow:auto}
.chip{background:#fff;border:1px solid #ddd;padding:8px 14px;border-radius:20px;font-size:12px;white-space:nowrap}
.chip.active{background:#000;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr);max-width:1100px;margin:auto}}
.card{background:#fff;border-radius:14px;padding:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.card img{width:100%;height:130px;object-fit:contain}
.card h4{font-size:13px;height:36px;overflow:hidden;margin:6px 0}
.price{font-weight:900}
.btn{background:#ffd814;width:100%;border:0;padding:9px;border-radius:22px;font-weight:800;margin-top:8px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:8px 0;z-index:99}
.b-item{font-size:11px;text-align:center;color:#666}.b-item.active{color:#ff6f00}.b-item div{font-size:22px}
.page{display:none}.page.active{display:block}
.detail{position:fixed;inset:0;background:#fff;z-index:200;display:none;overflow:auto}.detail.active{display:block}
.cart-page{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:150;display:none}.cart-page.active{display:block}
.cart-box{position:absolute;right:0;top:0;bottom:0;width:85%;max-width:400px;background:#fff;padding:16px;overflow:auto}
</style>
</head>
<body>

</div>

<div class="chips"><div class="chip active" onclick="filterC('all',this)">ALL</div><div class="chip" onclick="filterC('earbuds',this)">EARBUDS</div><div class="chip" onclick="filterC('watch',this)">WATCH</div><div class="chip" onclick="filterC('laptop',this)">LAPTOP</div><div class="chip" onclick="filterC('mobile',this)">MOBILE</div></div>

</div>
